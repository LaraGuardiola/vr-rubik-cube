<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>VR Rubik's Cube</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%23050510'/%3E%3Crect%20x='2'%20y='2'%20width='4'%20height='4'%20fill='%23ffffff'/%3E%3Crect%20x='8'%20y='2'%20width='4'%20height='4'%20fill='%230051ba'/%3E%3Crect%20x='2'%20y='8'%20width='4'%20height='4'%20fill='%23c41e3a'/%3E%3Crect%20x='8'%20y='8'%20width='4'%20height='4'%20fill='%23ffd500'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        z-index: 10;
        color: #fff;
        pointer-events: none;
      }
      #status {
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 14px;
        border-radius: 999px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #winToast {
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        font-weight: 700;
        color: #8affc1;
        text-shadow: 0 0 12px rgba(70, 255, 150, 0.7);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #winToast.show {
        opacity: 1;
      }
      .toolbar {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        pointer-events: auto;
      }
      .btn {
        pointer-events: auto;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 12px;
        backdrop-filter: blur(6px);
        transition: background 0.15s ease, transform 0.1s ease;
        touch-action: manipulation;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.primary {
        background: #6c5ce7;
        border-color: #8f7ff0;
      }
      .btn.primary:hover {
        background: #7d6df0;
      }
      .btn:disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      #xrButtons {
        position: fixed;
        z-index: 20;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
      }
      .xr-btn {
        pointer-events: auto;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(20, 20, 30, 0.75);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        transition: background 0.15s ease, transform 0.1s ease;
      }
      .xr-btn:hover {
        background: rgba(60, 60, 90, 0.9);
      }
      .xr-btn:active {
        transform: scale(0.96);
      }
      .hint {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        text-align: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 16px;
        border-radius: 10px;
        max-width: 90vw;
        pointer-events: none;
        white-space: pre-line;
      }
      @media (max-width: 700px) {
        #status {
          font-size: 12px;
          padding: 5px 10px;
        }
        .btn {
          font-size: 13px;
          padding: 9px 14px;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BEdntjQM.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="status" class="hud"></div>
    <div id="winToast" class="hud"></div>
    <div id="hint" class="hint"></div>
    <div id="toolbar" class="toolbar">
      <button id="btnScramble" class="btn primary">Scramble</button>
      <button id="btnReset" class="btn">Reset to Solved</button>
      <button id="btnUndo" class="btn">Undo</button>
    </div>
    <div id="xrButtons"></div>
  </body>
</html>
